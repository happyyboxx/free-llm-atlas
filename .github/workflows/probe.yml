name: Daily Provider Probe

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/providers.json'
      - 'scripts/probe.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run probe
        run: python3 scripts/probe.py --all

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/providers.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff data/providers.json
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/providers.json
          git commit -m "chore: update provider probe results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Check failed providers
        if: always()
        run: |
          python3 -c "import json; data=json.load(open('data/providers.json')); failed=[p for p in data['providers'] if p.get('status') in ('down','unknown')]; print(f'{len(failed)} providers down') if failed else print('All providers healthy')"
      
      - name: Send webhook notifications
        if: always()
        env:
          PROVIDER_WEBHOOK_URL: ${{ secrets.PROVIDER_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 scripts/notify_webhook.py || echo "Webhook notification failed (non-fatal)"
