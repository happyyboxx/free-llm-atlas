name: Deploy Providers JSON to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/providers.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare providers.json
        run: |
          mkdir -p ./public
          cp data/providers.json ./public/providers.json
          # Also create a latest.json symlink for stable URL
          cp data/providers.json ./public/latest.json
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
