name: Deploy Providers JSON to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/providers.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare site files
        run: |
          mkdir -p ./public
          # Copy providers.json (API data)
          cp data/providers.json ./public/providers.json
          cp data/providers.json ./public/latest.json
          # Copy frontend files
          cp index.html ./public/
          cp app.js ./public/
          cp styles.css ./public/
          cp i18n.json ./public/
          # Copy docs folder if exists
          if [ -d "docs" ]; then cp -r docs ./public/; fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
