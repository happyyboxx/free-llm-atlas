name: Weekly Upstream Sync

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx pyyaml

      - name: Sync from cheahjs
        run: python3 scripts/update_providers.py --source cheahjs

      - name: Sync from nejib1
        run: python3 scripts/update_providers.py --source nejib1

      - name: Sync from open-free-llm-api
        run: python3 scripts/update_providers.py --source open-free-llm-api

      - name: Validate
        run: python3 scripts/probe.py --validate

      - name: Commit if changed
        run: |
          if git diff --quiet data/providers.json; then
            echo "No changes from upstream sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/providers.json
            git commit -m "chore: weekly upstream sync $(date -u +'%Y-%m-%d')"
            git push
          fi
